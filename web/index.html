<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="description" content="Mecze polskich piłkarzy grających za granicą - minuty, gole, asysty i oceny.">
<title>NationFootball</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styl.css">
</head>
<body>
<header class="gora">
  <div class="pasek">
    <div class="logo"><img src="favicon.png" alt=""><span>NATION <b>FOOTBALL</b></span></div>
    <div class="akcje">
      <button id="instaluj" class="instaluj" hidden>Zainstaluj</button>
      <button id="odswiez" class="ikona-btn" aria-label="Odśwież">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </div>
  <nav id="dni" class="dni" aria-label="Wybór dnia"></nav>
</header>

<main id="glowna">
  <div class="naglowek-dnia">
    <h1 id="tytul-dnia"></h1>
    <p id="podsumowanie" class="podsumowanie"></p>
  </div>
  <div id="lista" class="lista" aria-live="polite"></div>
</main>

<script src="app.js"></script>

</html>
