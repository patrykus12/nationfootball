name: Podtrzymanie serwera

# Darmowy Render usypia serwer po 15 min bez ruchu - a uśpienie zatrzymuje harmonogram pobierania
# meczów i kasuje jego cache. Co 10 min "pukamy" do serwera, żeby działał bez przerwy.
# (GitHub potrafi opóźniać zaplanowane uruchomienia - dla pewności można dodatkowo ustawić to samo
# wywołanie w darmowym cron-job.org)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --max-time 120 --retry 3 --retry-delay 15 "${{ vars.NF_SERWER || 'https://nationfootball.onrender.com' }}/cron"
