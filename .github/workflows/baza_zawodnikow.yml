name: Cotygodniowa baza zawodnikow

on:
  schedule:
    - cron: "0 3 * * 1"   # poniedziałek ~05:00 czasu polskiego (GitHub liczy w UTC)
  workflow_dispatch:       # przycisk "Run workflow" do ręcznego odpalenia

permissions:
  contents: write

jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cloudscraper beautifulsoup4 pandas openpyxl requests pytz
      - name: Skan Transfermarkt + slownik lig z serwera
        env:
          NF_SERWER: ${{ vars.NF_SERWER || 'https://nationfootball.onrender.com' }}
        run: python aktualizuj_baze_automatycznie.py
      # Serwer sam pobiera nową bazę z repozytorium (co 6 h), więc "[skip render]" - bez restartu
      # serwera, który na darmowym planie skasowałby jego cache
      - name: Zapisz zmiany w repozytorium
        if: always()
        run: |
          git config user.name "nationfootball-bot"
          git config user.email "actions@users.noreply.github.com"
          git add zawodnicy.xlsx slownik_lig.json
          git diff --cached --quiet || (git commit -m "Automatyczna aktualizacja bazy zawodnikow i lig [skip render]" && git push)
