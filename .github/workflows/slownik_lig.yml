name: Codzienny slownik lig

# Serwer na darmowym planie traci dysk przy restarcie, a z nim nazwy lig ustalone z API.
# Raz dziennie dopisujemy je do repozytorium - serwer wczytuje je stąd po każdym starcie.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  slownik:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl pytz
      - name: Nazwy lig z serwera
        env:
          NF_SERWER: ${{ vars.NF_SERWER || 'https://nationfootball.onrender.com' }}
        run: python aktualizuj_baze_automatycznie.py --tylko-slownik
      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "nationfootball-bot"
          git config user.email "actions@users.noreply.github.com"
          git add slownik_lig.json
          git diff --cached --quiet || (git commit -m "Automatyczna aktualizacja slownika lig [skip render]" && git push)
